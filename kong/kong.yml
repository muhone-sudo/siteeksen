# SiteEksen — Kong (isteğe bağlı kenar katmanı)
#
# NEDEN YENİDEN YAZILDI (2026-09-27): Bu dosya 26 servisi TEK TEK yönlendiriyordu
# ve rotalar gateway'den (backend/cmd/gateway) sapmıştı: finans `/api/v1/assessments`
# gibi var olmayan yollara gidiyor, `/dashboard/*` toplaması hiç yoktu. Kong'un
# jwt eklentisi jeton İPTALİNİ (çıkış, şifre değişimi, tekrar kullanılan yenileme
# jetonu) bilmez; bu kontrol yalnızca servislerde ve gateway'dedir. İki yönlendirme
# tablosunu elle eşit tutmak her yeni uçta yeniden sapma demekti.
#
# ŞİMDİ: Kong yalnızca gateway'in ÖNÜNDE durur ve kenar işlerini yapar (IP başına
# hız sınırı, istek boyutu sınırı). Kimlik doğrulama, istemci kimlik başlıklarının
# silinmesi, CORS allowlist'i ve servis yönlendirmesi TEK YERDE, gateway'dedir.
# Servislere doğrudan rota YOKTUR (doğrulama betiği bunu denetler).
_format_version: '3.0'

services:
- name: gateway
  url: http://gateway:8888
  connect_timeout: 5000
  read_timeout: 60000
  write_timeout: 60000
  routes:
  # Giriş / yenileme / etkinleştirme: kaba kuvvete karşı sıkı sınır. Kimlik
  # servisindeki hesap kilidi (5 hata → 15 dk) hesap başınadır; bu sınır IP
  # başınadır ve çok hesaplı denemeyi yavaşlatır.
  - name: auth
    paths:
    - /api/v1/auth
    strip_path: false
    plugins:
    - name: rate-limiting
      config:
        minute: 20
        limit_by: ip
        policy: local
  - name: api
    paths:
    - /api/v1
    strip_path: false
    plugins:
    - name: rate-limiting
      config:
        minute: 600
        limit_by: ip
        policy: local
  - name: health
    paths:
    - /health
    strip_path: false
  plugins:
  # Belge yüklemesi (document servisi) en büyük gövdedir; sınır gateway ve
  # servisteki sınırdan küçük olmamalı.
  - name: request-size-limiting
    config:
      allowed_payload_size: 25
      size_unit: megabytes
