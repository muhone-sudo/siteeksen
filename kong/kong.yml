# SiteEksen Kong yapilandirmasi
#
# GUVENLIK (2026-09-13): Bu dosyada daha once HICBIR kimlik dogrulama eklentisi
# yoktu; Kong uzerinden maas, TCKN, IBAN ve API anahtarlari token'siz
# erisilebiliyordu. Artik /api/v1/auth disindaki tum rotalarda `jwt` eklentisi
# calisir. Jetonlar identity-service tarafindan HS256 ile ve iss="siteeksen"
# claim'i ile uretilir; asagidaki consumer ayni anahtari tasir.
#
# ${JWT_SECRET} degeri Kong baslatilirken ortamdan doldurulmalidir
# (docker-compose: KONG_DECLARATIVE_CONFIG uretimi / envsubst).
# CORS kokenleri joker (*) degil, allowlist'tir.
_format_version: '3.0'
services:
- name: identity-service
  url: http://identity-service:8081
  routes:
  - name: auth-routes
    paths:
    - /api/v1/auth
    strip_path: false
  - name: user-routes
    paths:
    - /api/v1/users
    strip_path: false
    plugins:
    - name: jwt
      config:
        claims_to_verify:
        - exp
        key_claim_name: iss
        secret_is_base64: false
        run_on_preflight: false
  plugins:
  - name: rate-limiting
    config:
      minute: 100
      policy: local
  - name: cors
    config:
      origins:
      - http://localhost:3000
      - http://localhost:3001
      methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
      headers:
      - Authorization
      - Content-Type
      max_age: 3600
      credentials: true
