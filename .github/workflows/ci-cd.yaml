# SiteEksen CI/CD
#
# 2026-09-13 revizyonu (tasks/todo.md madde 1.12). Önceki sürümün sorunları:
#   - Go 1.21 kuruluyordu, `go.mod` 1.24 istiyordu → CI'nin "yeşil" olması derlenebilirliği
#     kanıtlamıyordu.
#   - `go build ./...` ve `go vet ./...` hiç çalışmıyordu; yalnızca 5 servis ayrı ayrı
#     derleniyordu. Depoda derlenmeyen bir dizin (`backend/api/`) aylarca fark edilmedi.
#   - Lint ve type-check `|| true` ile çalışıyordu → başarısızlık görünmüyordu.
#   - Trivy bulgu bulsa da işi kırmıyordu (kapı değil, süsleme).
#   - `flutter analyze`/`flutter test` de `|| true` idi.
#
# Artık her adım gerçek bir kapıdır. Uçtan uca doğrulama için
# `backend/scripts/verify-stack.sh` çalıştırılır (aynı betik local'de de kullanılır).

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}
  GO_VERSION: '1.24'
  FLUTTER_VERSION: '3.47.4'

jobs:
  # ------------------------------------------------------------------
  # Backend: derleme, statik denetim, birim testleri
  # ------------------------------------------------------------------
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Download dependencies
        working-directory: ./backend
        run: go mod download

      # KAPI: tüm depo derlenmeli. Tek tek servis derlemesi, derlenmeyen bir paketi gizler.
      - name: Build all packages
        working-directory: ./backend
        run: go build ./...

      - name: Vet
        working-directory: ./backend
        run: go vet ./...

      - name: Check formatting
        working-directory: ./backend
        run: |
          UNFORMATTED=$(gofmt -l . | grep -v '^vendor/' || true)
          if [ -n "$UNFORMATTED" ]; then
            echo "Biçimlendirilmemiş dosyalar:"; echo "$UNFORMATTED"; exit 1
          fi

      - name: Unit tests
        working-directory: ./backend
        run: go test -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./backend/coverage.out
        continue-on-error: true

  # ------------------------------------------------------------------
  # Uçtan uca doğrulama: temiz veritabanı, migration'lar, gerçek HTTP akışları
  # ------------------------------------------------------------------
  verify-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      # 38. adım panelin uç tanımlarını (admin/src/lib/endpoints.ts) gerçek
      # gateway'e karşı çalıştırır; TypeScript'i doğrudan çalıştırmak için
      # Node 22.6+ gerekir (--experimental-strip-types).
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Bu betik: temiz PostgreSQL 16 kabı → cmd/migrate ile tüm migration'lar →
      # şema denetimi → idempotency → pkg/audit testi → identity-service ve gateway
      # üzerinden gerçek giriş/yetki/denetim izi/501 doğrulaması.
      - name: Run verify-stack.sh
        run: bash backend/scripts/verify-stack.sh

  # ------------------------------------------------------------------
  # Admin panel
  # ------------------------------------------------------------------
  admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        working-directory: ./admin
        run: npm ci

      - name: Lint
        working-directory: ./admin
        run: npm run lint

      - name: Type check
        working-directory: ./admin
        run: npx tsc --noEmit

      - name: Build
        working-directory: ./admin
        run: npm run build

  # ------------------------------------------------------------------
  # Mobil uygulamalar (sakin + yönetici)
  # ------------------------------------------------------------------
  mobile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [mobile, admin_app]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Install dependencies
        working-directory: ./${{ matrix.app }}
        run: flutter pub get

      # Hata ve uyarılar kapıdır. Bilgi (info) düzeyi uyarılar (prefer_const,
      # withOpacity deprecation vb.) henüz temizlenmedi; bilerek kapı değil —
      # bkz. tasks/todo.md 0.C.6.
      - name: Analyze
        working-directory: ./${{ matrix.app }}
        run: flutter analyze   # info düzeyi de kapı (0.C.6)

      - name: Test
        working-directory: ./${{ matrix.app }}
        run: flutter test

  # ------------------------------------------------------------------
  # Güvenlik taraması — bulgu varsa iş BAŞARISIZ olur (kapı)
  # ------------------------------------------------------------------
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy (dosya sistemi)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'

      # Gizli anahtar/parolanın depoya girmesini engeller.
      - name: Trivy (sır taraması)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'secret'
          exit-code: '1'

  # ------------------------------------------------------------------
  # Konteyner imajları — yalnızca main'e push'ta
  # ------------------------------------------------------------------
  images:
    needs: [backend, verify-stack, admin, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # BEGIN gen-deploy: imajlar
          # Bu dosya backend/scripts/gen-deploy.py ile ÜRETİLİR — elle düzenlemeyin.
          - name: identity-service
            context: ./backend
            dockerfile: services/identity/Dockerfile
          - name: finance-service
            context: ./backend
            dockerfile: services/finance/Dockerfile
          - name: community-service
            context: ./backend
            dockerfile: services/community/Dockerfile
          - name: iot-service
            context: ./backend
            dockerfile: services/iot/Dockerfile
          - name: notification-service
            context: ./backend
            dockerfile: services/notification/Dockerfile
          - name: expense-service
            context: ./backend
            dockerfile: services/expense/Dockerfile
          - name: asset-service
            context: ./backend
            dockerfile: services/asset/Dockerfile
          - name: bulletin-service
            context: ./backend
            dockerfile: services/bulletin/Dockerfile
          - name: contract-service
            context: ./backend
            dockerfile: services/contract/Dockerfile
          - name: document-service
            context: ./backend
            dockerfile: services/document/Dockerfile
          - name: energy-service
            context: ./backend
            dockerfile: services/energy_analytics/Dockerfile
          - name: esg-service
            context: ./backend
            dockerfile: services/esg/Dockerfile
          - name: inventory-service
            context: ./backend
            dockerfile: services/inventory/Dockerfile
          - name: meeting-service
            context: ./backend
            dockerfile: services/meeting_wizard/Dockerfile
          - name: nps-service
            context: ./backend
            dockerfile: services/nps/Dockerfile
          - name: package-service
            context: ./backend
            dockerfile: services/package/Dockerfile
          - name: parking-service
            context: ./backend
            dockerfile: services/parking/Dockerfile
          - name: patrol-service
            context: ./backend
            dockerfile: services/patrol/Dockerfile
          - name: personnel-service
            context: ./backend
            dockerfile: services/personnel/Dockerfile
          - name: reservation-service
            context: ./backend
            dockerfile: services/reservation/Dockerfile
          - name: settings-service
            context: ./backend
            dockerfile: services/settings/Dockerfile
          - name: smart-collection-service
            context: ./backend
            dockerfile: services/smart_collection/Dockerfile
          - name: survey-service
            context: ./backend
            dockerfile: services/survey/Dockerfile
          - name: visitor-service
            context: ./backend
            dockerfile: services/visitor/Dockerfile
          - name: banking-service
            context: ./backend
            dockerfile: services/banking/Dockerfile
          - name: governance-service
            context: ./backend
            dockerfile: services/governance/Dockerfile
          - name: gateway
            context: ./backend
            dockerfile: cmd/gateway/Dockerfile
          - name: migrate
            context: ./backend
            dockerfile: cmd/migrate/Dockerfile
          - name: scheduler
            context: ./backend
            dockerfile: cmd/scheduler/Dockerfile
          - name: admin-panel
            context: ./admin
            dockerfile: Dockerfile
          # END gen-deploy: imajlar
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.dockerfile }}
          push: true
          # Yalnızca admin paneli kullanır: tarayıcıya giden API adresi derleme
          # anında gömülür (Next.js NEXT_PUBLIC_*). Diğer imajlar yok sayar.
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.siteeksen.com/api/v1
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:latest
            ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:${{ github.sha }}

      # Liste backend/scripts/gen-deploy.py'den üretilir; 26 servisin tamamı,
      # gateway, migrate ve admin paneli. 501 dönen iki servis (banka, toplantı
      # sihirbazı) da yayınlanır: gateway'in 502 yerine GEREKÇELİ 501 dönmesi için.

  # ------------------------------------------------------------------
  # Dağıtım
  #
  # UYARI: Bu iş, gerekli secret'lar (KUBE_CONFIG) tanımlıysa çalışır.
  # Tanımlı değilse atlanır — sessizce "başarılı" görünmez.
  # ------------------------------------------------------------------
  deploy:
    needs: [images]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Gerekli secret kontrolü
        run: |
          if [ -z "${{ secrets.KUBE_CONFIG }}" ]; then
            echo "KUBE_CONFIG tanımlı değil — dağıtım atlanıyor."
            echo "skip=true" >> "$GITHUB_ENV"
          fi

      - name: Set up kubectl
        if: env.skip != 'true'
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        if: env.skip != 'true'
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      # Sıra önemlidir: migrate işi şemayı günceller ve servis rollerinin
      # parolasını atar. Bitmeden açılan servis ya eski şemayla çalışır ya da
      # veritabanına hiç bağlanamaz. Job tanımı değiştirilemez olduğu için her
      # dağıtımda silinip yeniden yaratılır.
      - name: Migrate
        if: env.skip != 'true'
        run: |
          kubectl delete job siteeksen-migrate --ignore-not-found
          kubectl apply -f k8s/migrate-job.yaml
          kubectl wait --for=condition=complete job/siteeksen-migrate --timeout=600s

      - name: Deploy to Kubernetes
        if: env.skip != 'true'
        run: |
          kubectl apply -f k8s/deployments.yaml
          kubectl apply -f k8s/ingress.yaml

      - name: Wait for rollout
        if: env.skip != 'true'
        run: |
          # BEGIN gen-deploy: rollout
          # Bu dosya backend/scripts/gen-deploy.py ile ÜRETİLİR — elle düzenlemeyin.
          kubectl rollout status deployment/identity-service --timeout=300s
          kubectl rollout status deployment/finance-service --timeout=300s
          kubectl rollout status deployment/community-service --timeout=300s
          kubectl rollout status deployment/iot-service --timeout=300s
          kubectl rollout status deployment/notification-service --timeout=300s
          kubectl rollout status deployment/expense-service --timeout=300s
          kubectl rollout status deployment/asset-service --timeout=300s
          kubectl rollout status deployment/bulletin-service --timeout=300s
          kubectl rollout status deployment/contract-service --timeout=300s
          kubectl rollout status deployment/document-service --timeout=300s
          kubectl rollout status deployment/energy-service --timeout=300s
          kubectl rollout status deployment/esg-service --timeout=300s
          kubectl rollout status deployment/inventory-service --timeout=300s
          kubectl rollout status deployment/meeting-service --timeout=300s
          kubectl rollout status deployment/nps-service --timeout=300s
          kubectl rollout status deployment/package-service --timeout=300s
          kubectl rollout status deployment/parking-service --timeout=300s
          kubectl rollout status deployment/patrol-service --timeout=300s
          kubectl rollout status deployment/personnel-service --timeout=300s
          kubectl rollout status deployment/reservation-service --timeout=300s
          kubectl rollout status deployment/settings-service --timeout=300s
          kubectl rollout status deployment/smart-collection-service --timeout=300s
          kubectl rollout status deployment/survey-service --timeout=300s
          kubectl rollout status deployment/visitor-service --timeout=300s
          kubectl rollout status deployment/banking-service --timeout=300s
          kubectl rollout status deployment/governance-service --timeout=300s
          kubectl rollout status deployment/scheduler --timeout=300s
          kubectl rollout status deployment/gateway --timeout=300s
          kubectl rollout status deployment/admin-panel --timeout=300s
          # END gen-deploy: rollout
