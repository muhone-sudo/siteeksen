# Bu dosya backend/scripts/gen-deploy.py ile ÜRETİLİR — elle düzenlemeyin.
#
# Beklenen gizli değerler (kubectl create secret generic ...):
#   db-admin      : host, password           → yalnızca migrate işi (şema sahibi)
#   db-app        : password                 → siteeksen_app (23 servis)
#   db-identity   : password                 → siteeksen_identity (kimlik servisi)
#   app-secrets   : jwt-secret, nextauth-secret, pii-encryption-key
#                   (isteğe bağlı: pii-encryption-key-id, pii-encryption-previous-keys)
#   storage       : endpoint, region, bucket, access-key-id, secret-access-key
#
# Sıra: önce k8s/migrate-job.yaml tamamlanmalı (şemayı günceller ve rol
# parolalarını atar), sonra bu dosya. CI bu sırayı uygular.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-service
  labels:
    app: identity-service
  annotations:
    siteeksen/not: "Kimlik, JWT, sakinler"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: identity-service
  template:
    metadata:
      labels:
        app: identity-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: identity-service
          image: ghcr.io/siteeksen/identity-service:latest
          ports:
            - containerPort: 8081
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: db-admin
                  key: host
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "siteeksen"
            - name: DB_SSLMODE
              value: "require"
            - name: DB_USER
              value: "siteeksen_identity"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-identity
                  key: password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: jwt-secret
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: identity-service
spec:
  selector:
    app: identity-service
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8081
  type: ClusterIP
---
