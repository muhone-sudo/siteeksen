# Bu dosya backend/scripts/gen-deploy.py ile ÜRETİLİR — elle düzenlemeyin.
# Servis listesi değişince betiği çalıştırın; verify-stack.sh sapmayı yakalar.
#
# Gizli değerler kök dizindeki .env dosyasından okunur (şablon: .env.example).
# Zorunlu bir değer verilmemişse compose AÇILMAZ: varsayılan bir parola ile
# sessizce ayağa kalkmak, üretimde bilinen parolayla çalışmak demekti.
#
# Veritabanı rolleri (RLS yalnızca süper kullanıcı OLMAYAN rollerde çalışır):
#   siteeksen            → yalnızca migrate (şema sahibi)
#   siteeksen_identity   → yalnızca identity-service
#   siteeksen_app        → diğer bütün servisler
# Rol parolalarını migrate kabı atar (cmd/migrate, APP_/IDENTITY_DB_PASSWORD).

name: siteeksen

x-app-env: &app-env
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: siteeksen
  DB_SSLMODE: disable
  DB_USER: siteeksen_app
  DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD gerekli (bkz. .env.example)}
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET gerekli (en az 32 karakter)}
  GIN_MODE: release

x-after-migrate: &after-migrate
  postgres:
    condition: service_healthy
  migrate:
    condition: service_completed_successfully

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: siteeksen
      POSTGRES_USER: siteeksen
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD gerekli (şema sahibi parolası)}
    ports:
      # Yalnızca yerel makineye açık; dışarıya yayınlanmaz.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siteeksen -d siteeksen"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Tek seferlik: migration'ları uygular ve servis rollerine parola atar.
  # Bütün servisler bunun BAŞARIYLA bitmesini bekler.
  migrate:
    build:
      context: ./backend
      dockerfile: cmd/migrate/Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: siteeksen
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD gerekli}
      DB_NAME: siteeksen
      DB_SSLMODE: disable
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD gerekli}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?IDENTITY_DB_PASSWORD gerekli}
      # Varsayılan KAPALI: bilinen parolalı demo hesaplar yalnızca açıkça
      # istenirse (SEED_DEMO_DATA=true) yüklenir.
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Kimlik, JWT, sakinler
  identity-service:
    build:
      context: ./backend
      dockerfile: services/identity/Dockerfile
    environment:
      <<: *app-env
      DB_USER: siteeksen_identity
      DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?IDENTITY_DB_PASSWORD gerekli}
    depends_on: *after-migrate
    restart: unless-stopped

  # Aidat, ödeme, gecikme tazminatı
  finance-service:
    build:
      context: ./backend
      dockerfile: services/finance/Dockerfile
    environment:
      <<: *app-env
    depends_on: *after-migrate
    restart: unless-stopped

  # Talepler ve duyurular
  community-service:
    build:
      context: ./backend
      dockerfile: services/community/Dockerfile
    environment:
      <<: *app-env
    depends_on: *after-migrate
    restart: unless-stopped

  # Sayaç ve ısı payı
  iot-service:
    build:
      context: ./backend
      dockerfile: services/iot/Dockerfile
    environment:
      <<: *app-env
    depends_on: *after-migrate
    restart: unless-stopped

  # Bildirim merkezi
  notification-service:
    build:
      context: ./backend
      dockerfile: services/notification/Dockerfile
    environment:
      <<: *app-env
    depends_on: *after-migrate
    restart: unless-stopped

  # Giderler
  expense-service:
    build:
      context: ./backend
      dockerfile: services/expense/Dockerfile
    environment:
      <<: *app-env
    depends_on: *after-migrate
    restart: unless-stopped

  # Demirbaş
  asset-service:
    build:
      context: ./backend
      dockerfile: services/asset/Dockerfile
    environment:
      <<: *app-env
    depends_on: *after-migrate
    restart: unless-stopped

  # İlan panosu
  bulletin-service:
    build:
      context: ./backend
      dockerfile: services/bulletin/Dockerfile
    environment:
      <<: *app-env
    depends_on: *after-migrate
    restart: unless-stopped

  # Sözleşmeler
  contract-service:
    build:
      context: ./backend
      dockerfile: services/contract/Dockerfile
    environment:
      <<: *app-env
    depends_on: *after-migrate
    restart: unless-stopped

  # Belge arşivi
  document-service:
    build:
      context: ./backend
      dockerfile: services/document/Dockerfile
    environment:
      <<: *app-env
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      STORAGE_LOCAL_DIR: /data/files
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-}
    volumes:
      - document_files:/data/files
    depends_on: *after-migrate
    restart: unless-stopped

  # Enerji analizi
  energy-service:
    build:
      context: ./backend
      dockerfile: services/energy_analytics/Dockerfile
    environment:
      <<: *app-env
    depends_on: *after-migrate
    restart: unless-stopped

  # Karbon ayak izi
  esg-service:
    build:
      context: ./backend
      dockerfile: services/esg/Dockerfile
    environment:
      <<: *app-env
    depends_on: *after-migrate
    restart: unless-stopped

  # Stok
  inventory-service:
    build:
      context: ./backend
      dockerfile: services/inventory/Dockerfile
    environment:
      <<: *app-env
    depends_on: *after-migrate
    restart: unless-stopped

  # Yazılmadı — 501 ile governance'a yönlendirir
  meeting-service:
    build:
      context: ./backend
      dockerfile: services/meeting_wizard/Dockerfile
    environment:
      <<: *app-env
    depends_on: *after-migrate
    restart: unless-stopped

  # Memnuniyet (NPS)
  nps-service:
    build:
      context: ./backend
      dockerfile: services/nps/Dockerfile
    environment:
      <<: *app-env
    depends_on: *after-migrate
    restart: unless-stopped

  # Kargo
  package-service:
    build:
      context: ./backend
      dockerfile: services/package/Dockerfile
    environment:
      <<: *app-env
    depends_on: *after-migrate
    restart: unless-stopped

  # Otopark
  parking-service:
    build:
      context: ./backend
      dockerfile: services/parking/Dockerfile
    environment:
      <<: *app-env
    depends_on: *after-migrate
    restart: unless-stopped

  # Devriye
  patrol-service:
    build:
      context: ./backend
      dockerfile: services/patrol/Dockerfile
    environment:
      <<: *app-env
    depends_on: *after-migrate
    restart: unless-stopped

  # Personel (TCKN/IBAN şifreli)
  personnel-service:
    build:
      context: ./backend
      dockerfile: services/personnel/Dockerfile
    environment:
      <<: *app-env
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY:?PII_ENCRYPTION_KEY gerekli (32 bayt, base64)}
    depends_on: *after-migrate
    restart: unless-stopped

  # Ortak alan rezervasyonu
  reservation-service:
    build:
      context: ./backend
      dockerfile: services/reservation/Dockerfile
    environment:
      <<: *app-env
    depends_on: *after-migrate
    restart: unless-stopped

  # Site ayarları
  settings-service:
    build:
      context: ./backend
      dockerfile: services/settings/Dockerfile
    environment:
      <<: *app-env
    depends_on: *after-migrate
    restart: unless-stopped

  # Tahsilat riski
  smart-collection-service:
    build:
      context: ./backend
      dockerfile: services/smart_collection/Dockerfile
    environment:
      <<: *app-env
    depends_on: *after-migrate
    restart: unless-stopped

  # Anket
  survey-service:
    build:
      context: ./backend
      dockerfile: services/survey/Dockerfile
    environment:
      <<: *app-env
    depends_on: *after-migrate
    restart: unless-stopped

  # Ziyaretçi
  visitor-service:
    build:
      context: ./backend
      dockerfile: services/visitor/Dockerfile
    environment:
      <<: *app-env
    depends_on: *after-migrate
    restart: unless-stopped

  # Yazılmadı — S-07 kararı, 501
  banking-service:
    build:
      context: ./backend
      dockerfile: services/banking/Dockerfile
    environment:
      <<: *app-env
    depends_on: *after-migrate
    restart: unless-stopped

  # KMK yönetişim
  governance-service:
    build:
      context: ./backend
      dockerfile: services/governance/Dockerfile
    environment:
      <<: *app-env
    depends_on: *after-migrate
    restart: unless-stopped

  # Tek giriş kapısı: kimlik doğrulama, istemci kimlik başlıklarının
  # silinmesi, CORS allowlist, istek kimliği.
  gateway:
    build:
      context: ./backend
      dockerfile: cmd/gateway/Dockerfile
    environment:
      IDENTITY_SERVICE_URL: http://identity-service:8081
      FINANCE_SERVICE_URL: http://finance-service:8082
      COMMUNITY_SERVICE_URL: http://community-service:8083
      IOT_SERVICE_URL: http://iot-service:8084
      NOTIFICATION_SERVICE_URL: http://notification-service:8085
      EXPENSE_SERVICE_URL: http://expense-service:8086
      ASSET_SERVICE_URL: http://asset-service:8087
      BULLETIN_SERVICE_URL: http://bulletin-service:8089
      CONTRACT_SERVICE_URL: http://contract-service:8090
      DOCUMENT_SERVICE_URL: http://document-service:8091
      ENERGY_SERVICE_URL: http://energy-service:8092
      ESG_SERVICE_URL: http://esg-service:8093
      INVENTORY_SERVICE_URL: http://inventory-service:8094
      MEETING_SERVICE_URL: http://meeting-service:8095
      NPS_SERVICE_URL: http://nps-service:8096
      PACKAGE_SERVICE_URL: http://package-service:8097
      PARKING_SERVICE_URL: http://parking-service:8098
      PATROL_SERVICE_URL: http://patrol-service:8099
      PERSONNEL_SERVICE_URL: http://personnel-service:8100
      RESERVATION_SERVICE_URL: http://reservation-service:8101
      SETTINGS_SERVICE_URL: http://settings-service:8102
      SMART_COLLECTION_SERVICE_URL: http://smart-collection-service:8103
      SURVEY_SERVICE_URL: http://survey-service:8104
      VISITOR_SERVICE_URL: http://visitor-service:8105
      BANKING_SERVICE_URL: http://banking-service:8106
      GOVERNANCE_SERVICE_URL: http://governance-service:8107
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET gerekli}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3001}
      GIN_MODE: release
    ports:
      - "${GATEWAY_HOST_PORT:-8888}:8888"
    depends_on:
      - identity-service
      - finance-service
      - community-service
      - iot-service
      - notification-service
      - expense-service
      - asset-service
      - bulletin-service
      - contract-service
      - document-service
      - energy-service
      - esg-service
      - inventory-service
      - meeting-service
      - nps-service
      - package-service
      - parking-service
      - patrol-service
      - personnel-service
      - reservation-service
      - settings-service
      - smart-collection-service
      - survey-service
      - visitor-service
      - banking-service
      - governance-service
    restart: unless-stopped

  admin-panel:
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        # Tarayıcıya giden adres DERLEME anında gömülür (Next.js).
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8888/api/v1}
    environment:
      # Sunucu tarafı (NextAuth) kabın içinden gateway'e gider.
      API_URL: http://gateway:8888/api/v1
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3001}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET gerekli}
    ports:
      - "3001:3001"
    depends_on:
      - gateway
    restart: unless-stopped

  # İsteğe bağlı: Kong (bildirimsel yapılandırma kong/kong.yml).
  # Varsayılan giriş kapısı yukarıdaki gateway'dir; Kong yalnızca
  # `docker compose --profile kong up` ile açılır.
  kong:
    image: kong:3.5
    profiles: [kong]
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
    ports:
      - "8000:8000"
    volumes:
      - ./kong/kong.yml:/kong/kong.yml:ro
    depends_on:
      - gateway

# Redis, MongoDB ve Kafka KALDIRILDI (2026-09-26): hiçbir servis bunlara
# bağlanmıyor (REDIS_URL / MONGO_URL / KAFKA_BROKERS kodda okunmuyor).
# Çalışmayan altyapıyı ayakta tutmak, var olmayan bir entegrasyonu var
# gibi gösteriyordu.
volumes:
  postgres_data:
  document_files:
