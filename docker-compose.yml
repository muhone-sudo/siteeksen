version: '3.8'

services:
  # PostgreSQL - Ana veritabanı
  postgres:
    image: postgres:16-alpine
    container_name: siteeksen-postgres
    environment:
      POSTGRES_DB: siteeksen
      POSTGRES_USER: siteeksen
      POSTGRES_PASSWORD: ${DB_PASSWORD:-siteeksen_dev_123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # NOT (2026-09-13, madde 1.7b): `./backend/migrations:/docker-entrypoint-initdb.d`
      # mount'u KALDIRILDI. initdb yalnızca veri dizini boşken çalışır; mevcut bir
      # veritabanına yeni migration uygulanamıyor, hangi sürümün uygulandığı
      # bilinmiyordu ve demo veri üretimde de yükleniyordu.
      # Migration'lar artık aşağıdaki `migrate` servisi tarafından uygulanır.
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U siteeksen" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Migration çalıştırıcısı — tek seferlik. Tüm servisler bunun BAŞARIYLA
  # tamamlanmasını bekler; böylece hiçbir servis eksik şemayla başlamaz.
  migrate:
    build:
      context: ./backend
      dockerfile: cmd/migrate/Dockerfile
    container_name: siteeksen-migrate
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: siteeksen
      DB_PASSWORD: ${DB_PASSWORD:-siteeksen_dev_123}
      DB_NAME: siteeksen
      DB_SSLMODE: disable
      # Üretimde false verin: bilinen şifreli demo hesaplar açılmaz.
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Redis - Cache ve Session
  redis:
    image: redis:7-alpine
    container_name: siteeksen-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  # MongoDB - Doküman veritabanı (IoT sensör verileri için)
  mongodb:
    image: mongo:7
    container_name: siteeksen-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: siteeksen
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-siteeksen_dev_123}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  # Kafka - Event Bus
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: siteeksen-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: siteeksen-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data

  # Identity Service
  identity-service:
    build:
      context: ./backend
      dockerfile: services/identity/Dockerfile
    container_name: siteeksen-identity
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: siteeksen
      DB_PASSWORD: ${DB_PASSWORD:-siteeksen_dev_123}
      DB_NAME: siteeksen
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      REDIS_URL: redis://redis:6379/0
      PORT: 8081
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Finance Service
  finance-service:
    build:
      context: ./backend
      dockerfile: services/finance/Dockerfile
    container_name: siteeksen-finance
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: siteeksen
      DB_PASSWORD: ${DB_PASSWORD:-siteeksen_dev_123}
      DB_NAME: siteeksen
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      IYZICO_API_KEY: ${IYZICO_API_KEY:-sandbox-key}
      IYZICO_SECRET_KEY: ${IYZICO_SECRET_KEY:-sandbox-secret}
      IYZICO_BASE_URL: https://sandbox-api.iyzipay.com
      PORT: 8082
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Community Service
  community-service:
    build:
      context: ./backend
      dockerfile: services/community/Dockerfile
    container_name: siteeksen-community
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: siteeksen
      DB_PASSWORD: ${DB_PASSWORD:-siteeksen_dev_123}
      DB_NAME: siteeksen
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      PORT: 8083
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # IoT Service
  iot-service:
    build:
      context: ./backend
      dockerfile: services/iot/Dockerfile
    container_name: siteeksen-iot
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: siteeksen
      DB_PASSWORD: ${DB_PASSWORD:-siteeksen_dev_123}
      DB_NAME: siteeksen
      MONGO_URL: mongodb://siteeksen:${MONGO_PASSWORD:-siteeksen_dev_123}@mongodb:27017
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      PORT: 8084
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      mongodb:
        condition: service_started

  # Notification Service
  notification-service:
    build:
      context: ./backend
      dockerfile: services/notification/Dockerfile
    container_name: siteeksen-notification
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: siteeksen
      DB_PASSWORD: ${DB_PASSWORD:-siteeksen_dev_123}
      DB_NAME: siteeksen
      REDIS_URL: redis://redis:6379/1
      KAFKA_BROKERS: kafka:29092
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-siteeksen-dev}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      PORT: 8085
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
      kafka:
        condition: service_started
    # NOT (2026-09-13, madde 1.11): `./firebase-credentials.json` bind mount'u KALDIRILDI.
    # Dosya depoda yok (ve olmamalı); Docker eksik yolu DİZİN olarak yaratıyor, bu da
    # dosya bekleyen kodu şaşırtıyor ve `docker-compose up`'ı kırıyordu.
    # Ayrıca denetimde tespit edildiği üzere Firebase koda hiç bağlanmamıştır.
    # Gerçek entegrasyona geçildiğinde kimlik bilgisi ortam değişkeniyle
    # (FIREBASE_CREDENTIALS_JSON) ya da bir secret yöneticisiyle verilmelidir.

  # Admin Panel (Next.js)
  admin-panel:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: siteeksen-admin
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8888/api/v1
      API_URL: http://gateway:8888/api/v1
      NEXTAUTH_URL: http://localhost:3001
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-your-nextauth-secret-change-in-production}
    ports:
      - "3001:3001"
    depends_on:
      - gateway

  # Expense Service
  expense-service:
    build:
      context: ./backend
      dockerfile: services/expense/Dockerfile
    container_name: siteeksen-expense
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: siteeksen
      DB_PASSWORD: ${DB_PASSWORD:-siteeksen_dev_123}
      DB_NAME: siteeksen
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      PORT: 8086
    ports:
      - "8086:8086"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Asset Service
  asset-service:
    build:
      context: ./backend
      dockerfile: services/asset/Dockerfile
    container_name: siteeksen-asset
    environment:
      PORT: 8087
    ports:
      - "8087:8087"

  # Bulletin Service
  bulletin-service:
    build:
      context: ./backend
      dockerfile: services/bulletin/Dockerfile
    container_name: siteeksen-bulletin
    environment:
      PORT: 8089
    ports:
      - "8089:8089"

  # Contract Service
  contract-service:
    build:
      context: ./backend
      dockerfile: services/contract/Dockerfile
    container_name: siteeksen-contract
    environment:
      PORT: 8090
    ports:
      - "8090:8090"

  # Document Service
  document-service:
    build:
      context: ./backend
      dockerfile: services/document/Dockerfile
    container_name: siteeksen-document
    environment:
      PORT: 8091
    ports:
      - "8091:8091"

  # Energy Analytics Service
  energy-service:
    build:
      context: ./backend
      dockerfile: services/energy_analytics/Dockerfile
    container_name: siteeksen-energy
    environment:
      PORT: 8092
    ports:
      - "8092:8092"

  # ESG Service
  esg-service:
    build:
      context: ./backend
      dockerfile: services/esg/Dockerfile
    container_name: siteeksen-esg
    environment:
      PORT: 8093
    ports:
      - "8093:8093"

  # Banking Service
  banking-service:
    build:
      context: ./backend
      dockerfile: services/banking/Dockerfile
    container_name: siteeksen-banking
    environment:
      PORT: 8106
    ports:
      - "8106:8106"

  # Inventory Service
  inventory-service:
    build:
      context: ./backend
      dockerfile: services/inventory/Dockerfile
    container_name: siteeksen-inventory
    environment:
      PORT: 8094
    ports:
      - "8094:8094"

  # Meeting Wizard Service
  meeting-service:
    build:
      context: ./backend
      dockerfile: services/meeting_wizard/Dockerfile
    container_name: siteeksen-meeting
    environment:
      PORT: 8095
    ports:
      - "8095:8095"

  # NPS Service
  nps-service:
    build:
      context: ./backend
      dockerfile: services/nps/Dockerfile
    container_name: siteeksen-nps
    environment:
      PORT: 8096
    ports:
      - "8096:8096"

  # Package Tracking Service
  package-service:
    build:
      context: ./backend
      dockerfile: services/package/Dockerfile
    container_name: siteeksen-package
    environment:
      PORT: 8097
    ports:
      - "8097:8097"

  # Parking Service
  parking-service:
    build:
      context: ./backend
      dockerfile: services/parking/Dockerfile
    container_name: siteeksen-parking
    environment:
      PORT: 8098
    ports:
      - "8098:8098"

  # Patrol Service
  patrol-service:
    build:
      context: ./backend
      dockerfile: services/patrol/Dockerfile
    container_name: siteeksen-patrol
    environment:
      PORT: 8099
    ports:
      - "8099:8099"

  # Personnel Service
  personnel-service:
    build:
      context: ./backend
      dockerfile: services/personnel/Dockerfile
    container_name: siteeksen-personnel
    environment:
      PORT: 8100
    ports:
      - "8100:8100"

  # Reservation Service
  reservation-service:
    build:
      context: ./backend
      dockerfile: services/reservation/Dockerfile
    container_name: siteeksen-reservation
    environment:
      PORT: 8101
    ports:
      - "8101:8101"

  # Settings Service
  settings-service:
    build:
      context: ./backend
      dockerfile: services/settings/Dockerfile
    container_name: siteeksen-settings
    environment:
      PORT: 8102
    ports:
      - "8102:8102"

  # Smart Collection Service
  smart-collection-service:
    build:
      context: ./backend
      dockerfile: services/smart_collection/Dockerfile
    container_name: siteeksen-smart-collection
    environment:
      PORT: 8103
    ports:
      - "8103:8103"

  # Survey Service
  survey-service:
    build:
      context: ./backend
      dockerfile: services/survey/Dockerfile
    container_name: siteeksen-survey
    environment:
      PORT: 8104
    ports:
      - "8104:8104"

  # Visitor Service
  visitor-service:
    build:
      context: ./backend
      dockerfile: services/visitor/Dockerfile
    container_name: siteeksen-visitor
    environment:
      PORT: 8105
    ports:
      - "8105:8105"

  # Demo Gateway
  gateway:
    build:
      context: ./backend
      dockerfile: cmd/gateway/Dockerfile
    container_name: siteeksen-gateway
    environment:
      IDENTITY_SERVICE_URL: http://identity-service:8081
      FINANCE_SERVICE_URL: http://finance-service:8082
      COMMUNITY_SERVICE_URL: http://community-service:8083
      IOT_SERVICE_URL: http://iot-service:8084
      NOTIFICATION_SERVICE_URL: http://notification-service:8085
      EXPENSE_SERVICE_URL: http://expense-service:8086
      ASSET_SERVICE_URL: http://asset-service:8087
      BULLETIN_SERVICE_URL: http://bulletin-service:8089
      CONTRACT_SERVICE_URL: http://contract-service:8090
      DOCUMENT_SERVICE_URL: http://document-service:8091
      ENERGY_SERVICE_URL: http://energy-service:8092
      ESG_SERVICE_URL: http://esg-service:8093
      INVENTORY_SERVICE_URL: http://inventory-service:8094
      MEETING_SERVICE_URL: http://meeting-service:8095
      NPS_SERVICE_URL: http://nps-service:8096
      PACKAGE_SERVICE_URL: http://package-service:8097
      PARKING_SERVICE_URL: http://parking-service:8098
      PATROL_SERVICE_URL: http://patrol-service:8099
      PERSONNEL_SERVICE_URL: http://personnel-service:8100
      RESERVATION_SERVICE_URL: http://reservation-service:8101
      SETTINGS_SERVICE_URL: http://settings-service:8102
      SMART_COLLECTION_SERVICE_URL: http://smart-collection-service:8103
      SURVEY_SERVICE_URL: http://survey-service:8104
      VISITOR_SERVICE_URL: http://visitor-service:8105
      BANKING_SERVICE_URL: http://banking-service:8106
      PORT: 8888
    ports:
      - "8888:8888"
    depends_on:
      - identity-service
      - finance-service
      - community-service

  # Kong API Gateway
  kong:
    image: kong:3.5
    container_name: siteeksen-kong
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    ports:
      - "8000:8000"
      - "8001:8001"
    volumes:
      - ./kong/kong.yml:/kong/kong.yml:ro
    depends_on:
      - identity-service
      - finance-service
      - community-service
      - iot-service
      - notification-service

volumes:
  postgres_data:
  redis_data:
  mongodb_data:
  zookeeper_data:
  kafka_data:
