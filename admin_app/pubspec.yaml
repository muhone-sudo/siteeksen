name: siteeksen_admin
description: SiteEksen Yönetici Paneli - Site yöneticileri için mobil uygulama

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  
  # Navigation
  go_router: ^13.0.1
  
  # Network
  dio: ^5.4.0
  
  # Local Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # Biometric Auth
  local_auth: ^2.1.8

  # UI Components
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  
  # Forms
  flutter_form_builder: ^10.2.0
  form_builder_validators: ^11.0.0
  
  # Charts
  fl_chart: ^0.66.0
  
  # Date/Time
  intl: any
  
  # File handling
  path_provider: ^2.1.2
  
  # Notifications
  flutter_local_notifications: ^17.2.4
  
  # Utils
  url_launcher: ^6.2.4
  package_info_plus: ^8.0.0
  connectivity_plus: ^5.0.2
  open_filex: ^4.7.0
  file_picker: ^11.0.3
  web: ^1.1.1
  mobile_scanner: ^7.4.2
  geolocator: ^13.0.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  riverpod_generator: ^2.3.9
  build_runner: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
